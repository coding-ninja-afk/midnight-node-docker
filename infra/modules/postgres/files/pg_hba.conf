# Mounted read-only by infra/modules/postgres. First match wins.
# TYPE    DATABASE  USER      ADDRESS  METHOD
# In-container unix socket: healthcheck and admin via `docker exec` (same as the official image).
local     all       all                trust
# midnight-node: read-only role, TLS required (node 2.1.101 connects over TLS only).
hostssl   all       midnight  all      scram-sha-256
host      all       midnight  all      reject
# cardano-db-sync on the internal network (no published port, network has no egress).
host      all       all       all      scram-sha-256
