# Monitoring for the Midnight PreProd FNO stack (Section 2).
#   docker compose -f monitoring/compose.yml up -d
# Joins the live stack's network (midnight-preprod_default) to scrape cardano-node (via a sidecar)
# and cardano-db-sync. UIs are published on 127.0.0.1 only. Images pinned by digest.
name: midnight-monitoring

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password   # git-ignored; created by scripts/init-secrets.sh

services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB      # bounded: disk is the scarce resource on this host
      - --web.enable-lifecycle                 # POST /-/reload after rule changes (127.0.0.1 only)
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring, stack]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [monitoring]
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [monitoring]
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command: [--path.rootfs=/host]
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    logging: *logging

  # cardano-node 11.0.1 serves metrics on 127.0.0.1:12798 inside its own container only. This
  # sidecar joins that network namespace and forwards :12799 -> 127.0.0.1:12798, so the live node's
  # config is not touched. If the node container is RECREATED, restart this sidecar
  # (MonitoringTargetDown fires until then; see README).
  cardano-node-metrics:
    image: alpine/socat:1.8.1.1@sha256:7f9a06753033f2b7de18edc2353f2c15153413d95a039163c6db270fc7a6c3b0
    restart: unless-stopped
    network_mode: "container:midnight-preprod-cardano-node-1"
    command: ["-d", "TCP-LISTEN:12799,fork,reuseaddr", "TCP:127.0.0.1:12798"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  monitoring: {}
  stack:
    external: true
    name: midnight-preprod_default

volumes:
  prometheus-data: {}
  alertmanager-data: {}
  grafana-data: {}
