# promtool unit tests for monitoring/prometheus/rules/midnight-fno.rules.yml
# Run: monitoring/scripts/check.sh   (or: promtool test rules monitoring/prometheus/tests/*.test.yml)
# Every test checks ALL 13 alerts at each eval time: listed ones must fire with exactly these
# labels, all others must NOT fire. Series are 1-minute samples; '_' = no sample (target down).
rule_files:
- ../rules/midnight-fno.rules.yml
- params-test.yml
evaluation_interval: '1m'
tests:
- interval: '1m'
  name: 'healthy steady state: nothing fires'
  input_series:
  - series: 'up{job="cardano-node",instance="cardano-node:12799"}'
    values: 1x120
  - series: 'up{job="cardano-db-sync",instance="cardano-db-sync:8080"}'
    values: 1x120
  - series: 'up{job="node-exporter",instance="node-exporter:9100"}'
    values: 1x120
  - series: 'up{job="midnight-node",instance="midnight-node:9615"}'
    values: 1x120
  - series: 'cardano_node_metrics_slotNum_int{job="cardano-node",instance="cardano-node:12799"}'
    values: 100000+60x120
  - series: 'cardano_db_sync_db_slot_height{job="cardano-db-sync",instance="cardano-db-sync:8080"}'
    values: 100000+60x120
  - series: 'cardano_db_sync_db_block_height{job="cardano-db-sync",instance="cardano-db-sync:8080"}'
    values: 5000+3x120
  - series: 'cardano_db_sync_node_block_height{job="cardano-db-sync",instance="cardano-db-sync:8080"}'
    values: 5000+3x120
  - series: 'substrate_block_height{status="best",job="midnight-node",instance="midnight-node:9615"}'
    values: 1000+10x120
  - series: 'substrate_block_height{status="finalized",job="midnight-node",instance="midnight-node:9615"}'
    values: 998+10x120
  - series: 'substrate_block_height{status="sync_target",job="midnight-node",instance="midnight-node:9615"}'
    values: 1001+10x120
  - series: 'substrate_sub_libp2p_is_major_syncing{job="midnight-node",instance="midnight-node:9615"}'
    values: '0x120'
  - series: 'node_filesystem_avail_bytes{job="node-exporter",instance="node-exporter:9100",mountpoint="/",fstype="ext4",device="/dev/sda2"}'
    values: 60000000000x120
  - series: 'node_filesystem_size_bytes{job="node-exporter",instance="node-exporter:9100",mountpoint="/",fstype="ext4",device="/dev/sda2"}'
    values: 120000000000x120
  alert_rule_test:
  - eval_time: 30m
    alertname: CardanoNodeTipStale
    exp_alerts: []
  - eval_time: 30m
